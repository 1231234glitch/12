name: Build Unity game
on:
  workflow_dispatch:
    inputs:
      targetPlatform:
        description: Unity build target
        required: true
        default: StandaloneWindows64
        type: choice
        options: [StandaloneWindows64, WebGL]
permissions:
  contents: read
  checks: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Unity license requirement
        shell: bash
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Add a valid Unity build license as the repository secret UNITY_LICENSE. Do not paste credentials into chat. No Unity build has been run without this requirement."
            exit 1
          fi
      - name: Run Unity EditMode and PlayMode tests
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: Unity/ProjectHINA
          testMode: all
          coverageEnabled: false
          artifactsPath: unity-test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Build actual Unity game
        uses: game-ci/unity-builder@v4
        with:
          projectPath: Unity/ProjectHINA
          unityVersion: 2022.3.62f1
          targetPlatform: ${{ inputs.targetPlatform }}
          buildMethod: Hina.Editor.ProjectSetup.BuildCI
          buildName: ProjectHINA
          buildsPath: build
          versioning: None
          allowDirtyBuild: true
      - name: Upload game build
        uses: actions/upload-artifact@v4
        with:
          name: ProjectHINA-${{ inputs.targetPlatform }}
          path: build/${{ inputs.targetPlatform }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload Unity test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-test-results
          path: unity-test-results
          if-no-files-found: ignore
